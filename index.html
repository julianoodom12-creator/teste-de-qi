<style>
  :root{
    --primary:#17c964; --green:#17c964; --bg:#f4f6f9; --card:#ffffff;
    --text:#0f1720; --muted:#6b7480; --line:#e3e7ee; --red:#f31260; --red-soft:#fee7ee;
    --green-soft:#e8fbf0; --green-ink:#0d7a3f; --ink:#1e293b; --accent:#0ea5e9;
    --input-bg:#f1f5f9; --hover-bg:#fafbfc; --hover-line:#b7c0cc;
    --pix-bg:#f0fdf4; --pix-border:#86efac;
    --ad-bg:#f8fafc; --ad-border:#e3e7ee; --ad-label:#94a3b8;
    --shadow-sm:0 1px 2px rgba(15,23,32,.06);
    --shadow-md:0 4px 16px rgba(15,23,32,.06),0 1px 3px rgba(15,23,32,.04);
    --shadow-lg:0 12px 40px rgba(15,23,32,.10),0 2px 8px rgba(15,23,32,.05);
    color-scheme:light;
  }
  [data-theme="dark"]{
    --bg:#0a0e1a; --card:#141a2e;
    --text:#eef5ff; --muted:#8ba3c7; --line:#2a3450; --red:#ff4d6d; --red-soft:rgba(255,77,109,.14);
    --green-soft:rgba(23,201,100,.14); --green-ink:#4ee08a; --ink:#eef5ff; --accent:#4ee5ff;
    --input-bg:#1a2036; --hover-bg:#1a2036; --hover-line:#4a5678;
    --pix-bg:rgba(23,201,100,.08); --pix-border:rgba(78,224,138,.35);
    --ad-bg:#0f1524; --ad-border:#2a3450; --ad-label:#5a678a;
    --shadow-sm:0 1px 2px rgba(0,0,0,.35);
    --shadow-md:0 4px 16px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.3);
    --shadow-lg:0 12px 40px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.35);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
  a{color:inherit}
  .wrap{max-width:980px;margin:0 auto;padding:0 24px}
  header{position:sticky;top:0;z-index:50;background:color-mix(in srgb, var(--bg) 88%, transparent);
    -webkit-backdrop-filter:saturate(160%) blur(12px);backdrop-filter:saturate(160%) blur(12px);
    border-bottom:1px solid var(--line)}
  .header-inner{height:64px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .logo{font-weight:800;font-size:19px;letter-spacing:-.4px;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:8px;flex-shrink:0}
  .logo .mark{width:26px;height:26px;background:var(--green);border-radius:8px;display:grid;place-items:center;flex-shrink:0}
  .logo .mark svg{width:16px;height:16px;display:block}
  .logo .dot{color:var(--green)}
  .header-right{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
  .visits-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line);
    border-radius:9px;background:var(--card);font-size:12.5px;font-weight:600;color:var(--text);
    user-select:none;white-space:nowrap}
  .visits-chip .ic{font-size:13px;line-height:1}
  .visits-chip b{color:var(--green);font-variant-numeric:tabular-nums}
  .visits-chip .sep{opacity:.3;margin:0 2px}
  main{padding:40px 0 60px}
  .card{background:var(--card);border-radius:18px;padding:36px;box-shadow:var(--shadow-md);border:1px solid var(--line);
    transition:background .3s,border-color .3s}
  h1{font-size:26px;text-align:center;font-weight:700;letter-spacing:-.4px;margin:0 0 8px;line-height:1.3}
  .subtitle{text-align:center;color:var(--muted);font-size:15px;margin:0 0 28px;line-height:1.5}
  h1 .hl{color:var(--green)}
  ul.bullets{list-style:none;padding:0;margin:0 auto 28px;max-width:540px}
  ul.bullets li{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px;color:var(--text);font-size:15px;line-height:1.5;opacity:.85}
  ul.bullets svg{flex-shrink:0;color:var(--green);margin-top:3px}
  .cta-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px}
  .btn{appearance:none;border:1px solid var(--green);background:var(--green);color:#fff;
    font-family:inherit;font-size:15px;font-weight:600;padding:13px 26px;border-radius:12px;cursor:pointer;
    min-width:150px;letter-spacing:-.1px;transition:transform .06s,opacity .15s,box-shadow .15s;
    box-shadow:0 1px 2px rgba(23,201,100,.25),0 4px 12px rgba(23,201,100,.15)}
  .btn:hover{opacity:.94;box-shadow:0 2px 4px rgba(23,201,100,.3),0 6px 18px rgba(23,201,100,.2)}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
  .btn.ghost{background:var(--card);color:var(--text);border-color:var(--line);box-shadow:var(--shadow-sm)}
  .btn.ghost:hover{border-color:var(--hover-line);box-shadow:var(--shadow-md)}
  .avg{text-align:center;color:var(--muted);font-size:13.5px;margin-top:18px;font-variant-numeric:tabular-nums}
  .note{text-align:center;color:var(--muted);font-size:13px;margin-top:26px;line-height:1.55;padding-top:22px;border-top:1px solid var(--line)}
  .q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:13.5px;color:var(--muted);font-weight:500}
  .q-head .timer{font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;
    padding:4px 10px;border-radius:8px;background:var(--input-bg);transition:background .2s,color .2s}
  .q-head .timer.warn{color:var(--red);background:var(--red-soft)}
  .bar{height:6px;background:var(--input-bg);border-radius:99px;overflow:hidden;margin-bottom:6px}
  .bar > i{display:block;height:100%;background:var(--green);width:0;transition:width .3s;border-radius:99px}
  .tbar{height:4px;background:var(--input-bg);border-radius:99px;overflow:hidden;margin-bottom:28px}
  .tbar > i{display:block;height:100%;background:var(--green);width:100%;transition:width .25s linear;border-radius:99px}
  .tbar > i.warn{background:var(--red)}
  .question{font-size:20px;font-weight:600;line-height:1.45;margin:0 0 24px;letter-spacing:-.2px}
  .matrix{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:420px;margin:0 auto 24px}
  .mcell{aspect-ratio:1;background:var(--input-bg);border:1.5px solid var(--line);border-radius:12px;
    display:grid;place-items:center;padding:10px}
  .mcell.missing{background:var(--card);border-style:dashed;border-color:var(--green)}
  .mcell svg{width:100%;height:100%;display:block}
  .options-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:8px}
  .options-list{display:grid;gap:10px}
  .opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1.5px solid var(--line);
    border-radius:12px;background:var(--card);cursor:pointer;font-size:15px;font-weight:500;
    transition:border-color .15s,background .15s,transform .06s;user-select:none;position:relative}
  .opt:hover{border-color:var(--hover-line);background:var(--hover-bg)}
  .opt:active{transform:scale(.995)}
  .opt.selected{border-color:var(--green);background:var(--green-soft);box-shadow:0 0 0 3px rgba(23,201,100,.12)}
  .opt.correct{border-color:var(--green);background:var(--green-soft);box-shadow:0 0 0 3px rgba(23,201,100,.18)}
  .opt.wrong{border-color:var(--red);background:var(--red-soft);box-shadow:0 0 0 3px rgba(243,18,96,.14)}
  .opt.locked{cursor:default}
  .opt.locked:hover{border-color:inherit;background:inherit}
  .opt input{accent-color:var(--green);margin:0;position:absolute;opacity:0;pointer-events:none}
  .opt-viz{padding:12px;display:grid;place-items:center;aspect-ratio:1;background:var(--card)}
  .opt-viz.correct{background:var(--green-soft)}
  .opt-viz.wrong{background:var(--red-soft)}
  .opt-viz svg{width:100%;height:100%;display:block;max-width:80px}
  .opt-badge{position:absolute;top:8px;right:10px;font-size:16px;font-weight:800}
  .opt.correct .opt-badge,.opt-viz.correct .opt-badge{color:var(--green)}
  .opt.wrong .opt-badge,.opt-viz.wrong .opt-badge{color:var(--red)}
  .feedback{margin-top:14px;padding:14px 16px;border-radius:12px;font-size:14px;font-weight:600;
    display:flex;align-items:center;gap:10px}
  .feedback.ok{background:var(--green-soft);color:var(--green-ink);border:1px solid rgba(23,201,100,.3)}
  .feedback.no{background:var(--red-soft);color:var(--red);border:1px solid rgba(243,18,96,.25)}
  .feedback svg{flex-shrink:0}
  .nav{display:flex;justify-content:space-between;margin-top:20px;gap:12px}
  .result{text-align:center}
  .score{font-size:96px;font-weight:800;color:var(--green);line-height:1;margin:8px 0 6px;letter-spacing:-3px;font-variant-numeric:tabular-nums}
  .score-sub{color:var(--muted);margin-bottom:28px;font-size:15px}
  .score-sub b{color:var(--ink);font-weight:700}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:28px 0}
  .stat{background:var(--input-bg);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center}
  .stat b{display:block;font-size:24px;color:var(--text);font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
  .stat span{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:500}
  .certbox{margin-top:20px;padding:28px;border-radius:16px;text-align:center;
    background:linear-gradient(135deg, rgba(23,201,100,.08), rgba(14,165,233,.06));
    border:1.5px solid var(--green)}
  .certbox h2{margin:0 0 8px;font-size:19px;font-weight:700;letter-spacing:-.2px}
  .certbox p{color:var(--muted);font-size:14px;margin:0 0 20px;line-height:1.6}
  .certbox .btn{min-width:200px;padding:15px 28px;font-size:15.5px}
  .certbox .ic{font-size:52px;line-height:1;margin-bottom:12px;display:block;
    filter:drop-shadow(0 4px 14px rgba(23,201,100,.4))}
  .lang-switch{position:relative;display:inline-flex;align-items:center;gap:6px;
    padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);
    cursor:pointer;font-size:13px;font-weight:500;user-select:none;font-family:inherit;color:var(--text)}
  .lang-switch .flag{width:20px;height:14px;border-radius:2px;flex-shrink:0;display:block}
  .lang-switch .flag svg{width:100%;height:100%;display:block}
  .lang-switch .chev{transition:transform .2s;opacity:.55}
  .lang-switch[data-open="true"] .chev{transform:rotate(180deg)}
  .lang-menu{position:absolute;top:calc(100% + 6px);right:0;min-width:230px;max-height:400px;
    overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow-lg);padding:6px;z-index:9999}
  .lang-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;
    border:0;background:transparent;border-radius:8px;font-family:inherit;font-size:13.5px;text-align:left;cursor:pointer;color:var(--text)}
  .lang-menu button:hover{background:var(--input-bg)}
  .lang-menu button[data-active="true"]{background:var(--green-soft);color:var(--green-ink);font-weight:600}
  .lang-menu .flag{width:22px;height:16px;border-radius:2px;flex-shrink:0;display:block}
  .lang-menu .flag svg{width:100%;height:100%;display:block}
  .theme-btn{width:38px;height:38px;padding:0;border:1px solid var(--line);border-radius:9px;
    background:var(--card);cursor:pointer;display:grid;place-items:center;color:var(--text);
    font-size:17px;transition:border-color .15s,transform .1s}
  .theme-btn:hover{border-color:var(--hover-line)}
  .theme-btn:active{transform:scale(.94)}
  @keyframes rgb-shift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  .domwebsite-rgb{
    background:linear-gradient(90deg,#ff004c,#ff8a00,#ffe600,#22ff5c,#00e5ff,#4a5cff,#c400ff,#ff004c);
    background-size:400% 400%;animation:rgb-shift 6s linear infinite;
    -webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700;letter-spacing:.3px;text-decoration:none}
  footer{border-top:1px solid var(--line);background:var(--card);padding:26px 20px;
    font-size:13.5px;color:var(--muted);transition:background .3s,border-color .3s}
  .footer-inner{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px;align-items:center}
  .donation-box{width:100%;max-width:640px;padding:18px 20px;border-radius:14px;
    background:var(--pix-bg);border:1.5px dashed var(--pix-border);
    text-align:center;line-height:1.55;font-size:13.5px;color:var(--text)}
  .donation-box .heart{font-size:22px;line-height:1;display:block;margin-bottom:8px}
  .donation-box p{margin:0 0 12px;color:var(--muted)}
  .donation-box p b{color:var(--text);font-weight:700}
  .pix-inline{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;max-width:420px;margin:0 auto}
  .pix-inline code{flex:1;min-width:170px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
    font-size:13.5px;background:var(--card);padding:10px 12px;border-radius:8px;border:1px solid var(--line);color:var(--text);
    letter-spacing:.02em;overflow:auto;text-align:center;font-weight:600}
  .pix-inline button{appearance:none;border:1px solid var(--green);background:var(--green);color:#fff;
    font-family:inherit;font-size:13px;font-weight:600;padding:10px 16px;border-radius:8px;cursor:pointer;
    transition:opacity .15s,transform .06s;min-width:100px}
  .pix-inline button:hover{opacity:.92}
  .pix-inline button:active{transform:translateY(1px)}
  .credit{font-size:13px;color:var(--muted);text-align:center}
  .cat{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.6px;
    text-transform:uppercase;color:var(--accent);background:rgba(14,165,233,.12);
    padding:4px 10px;border-radius:6px;margin-bottom:12px}
  .boot-error{text-align:center;padding:40px 20px}
  .progress-dots{display:flex;gap:4px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
  .pdot{width:8px;height:8px;border-radius:99px;background:var(--line)}
  .pdot.done-ok{background:var(--green)}
  .pdot.done-no{background:var(--red)}
  .pdot.current{background:var(--ink);transform:scale(1.3)}

  /* ========== ADSENSE SLOTS ========== */
  .ad-slot{
    margin:20px 0;
    padding:8px;
    background:var(--ad-bg);
    border:1px dashed var(--ad-border);
    border-radius:12px;
    text-align:center;
    min-height:70px;
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .ad-slot::before{
    content:'PUBLICIDADE';
    position:absolute;
    top:6px;left:12px;
    font-size:9px;
    letter-spacing:.14em;
    color:var(--ad-label);
    font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
    font-weight:600;
  }
  .ad-slot ins{display:block;width:100%;min-height:60px}
  .ad-slot.tall{min-height:250px}
  .ad-slot.tall ins{min-height:240px}

  .ad-side{
    position:fixed;
    top:120px;
    right:20px;
    width:160px;
    min-height:600px;
    z-index:40;
    display:none;
  }
  @media(min-width:1400px){
    .ad-side{display:block}
  }

  @media(max-width:640px){
    .card{padding:24px}
    .score{font-size:72px}
    .matrix{max-width:320px}
    .options-grid{gap:8px}
    .header-inner{height:auto;padding:12px 0;flex-wrap:wrap}
    .wrap{padding:0 16px}

/* ============== TEMA ============== */
function getTheme(){
  try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light") return t;}catch(e){}
  return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
}
function setTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  try{localStorage.setItem("theme", t);}catch(e){}
  var btn=document.getElementById("themeBtn");
  if(btn) btn.textContent=(t==="dark")?"☀️":"🌙";
  var meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", t==="dark" ? "#0a0e1a" : "#FFFFFF");
}
function toggleTheme(){
  var cur=document.documentElement.getAttribute("data-theme")||"light";
  setTheme(cur==="dark" ? "light" : "dark");
}

/* ============== CONTADOR DE VISITAS ============== */
var VISITS_KEY="qi_visits_v1";
function todayKey(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function registerVisit(){
  var total=0,today=0,stored={};
  try{var raw=localStorage.getItem(VISITS_KEY);if(raw) stored=JSON.parse(raw);}catch(e){}
  total=parseInt(stored.total||0,10);
  today=parseInt(stored.today||0,10);
  var storedDay=stored.day||"";
  var nowDay=todayKey();
  if(storedDay!==nowDay){today=0;storedDay=nowDay;}
  var alreadyThisSession=false;
  try{alreadyThisSession=sessionStorage.getItem("qi_session_counted")==="1";}catch(e){}
  if(!alreadyThisSession){
    total++;today++;
    try{sessionStorage.setItem("qi_session_counted","1");}catch(e){}
  }
  try{localStorage.setItem(VISITS_KEY,JSON.stringify({total:total,today:today,day:storedDay}));}catch(e){}
  return {total:total,today:today};
}
function renderVisits(){
  var v=registerVisit();
  var elT=document.getElementById("visitsTotal");
  var elD=document.getElementById("visitsToday");
  var loc = getLang();
  if(elT) elT.textContent=v.total.toLocaleString(loc);
  if(elD) elD.textContent=v.today.toLocaleString(loc);
}

function t(k){var L=I18N[getLang()]||I18N["pt-BR"];return (k in L)?L[k]:I18N["pt-BR"][k];}
function tLevels(){var L=I18N[getLang()]||I18N["pt-BR"];return L.levels||I18N["pt-BR"].levels;}
function catLabel(c){return t("cat"+c);}
function getLang(){
  var l="pt-BR";
  try{
    var c=document.cookie.match(/(?:^|; )lang=([^;]+)/);
    l=(c&&c[1])||localStorage.getItem("lang")||navigator.language||"pt-BR";
  }catch(e){l=navigator.language||"pt-BR";}
  for(var i=0;i<LANGS.length;i++){var x=LANGS[i];if(x.code===l||x.code.split("-")[0]===l.split("-")[0])return x.code;}
  return "pt-BR";
}
function setLang(code){
  try{document.cookie="lang="+code+";path=/;max-age=31536000;SameSite=Lax";}catch(e){}
  try{localStorage.setItem("lang",code);}catch(e){}
  document.documentElement.lang=code;
  document.documentElement.dir=code==="ar"?"rtl":"ltr";
  renderLang();
  applyFooterI18N();
  renderVisits();
  render();
}

var QUESTION_BANK=VISUAL_QUESTIONS.concat(KNOWLEDGE_QUESTIONS);

/* ============== HISTÓRICO ============== */
var HISTORY_KEY="iq_asked_ids_v4";
var MAX_HISTORY=Math.max(0,QUESTION_BANK.length-QUIZ_SIZE);
function loadHistory(){try{return JSON.parse(localStorage.getItem(HISTORY_KEY)||"[]");}catch(e){return [];}}
function saveHistory(h){try{localStorage.setItem(HISTORY_KEY,JSON.stringify(h.slice(-MAX_HISTORY)));}catch(e){}}
function shuffle(arr){for(var k=arr.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=arr[k];arr[k]=arr[j];arr[j]=t;}return arr;}
function pickQuestions(){
  var hist=loadHistory();
  var all=[];
  for(var i=0;i<QUESTION_BANK.length;i++)all.push(i);
  var pool=all.filter(function(i){return hist.indexOf(i)<0;});
  if(pool.length<QUIZ_SIZE){
    var keep=hist.slice(-(QUESTION_BANK.length-QUIZ_SIZE));
    saveHistory(keep);
    pool=all.filter(function(i){return keep.indexOf(i)<0;});
  }
  var vis=[],know=[];
  for(i=0;i<pool.length;i++){
    if(QUESTION_BANK[pool[i]].cat==="Visual")vis.push(pool[i]);
    else know.push(pool[i]);
  }
  shuffle(vis);shuffle(know);
  var picked=vis.slice(0,7).concat(know.slice(0,QUIZ_SIZE-7));
  picked.sort(function(a,b){return a-b;});
  saveHistory(hist.concat(picked));
  return picked.map(function(i){return QUESTION_BANK[i];});
}

var state={screen:"start",idx:0,questions:[],answers:[],revealed:[],
  startTime:0,endTime:0,score:0,result:null,
  timerId:null,timeLeft:SECONDS_PER_Q,questionStart:0,perQTimes:[]};

function startTimer(){
  stopTimer();
  state.timeLeft=SECONDS_PER_Q;
  state.questionStart=performance.now();
  updateTimerUI();
  state.timerId=setInterval(function(){
    state.timeLeft-=1;
    if(state.timeLeft<=0){
      state.timeLeft=0;updateTimerUI();stopTimer();
      if(state.answers[state.idx]===null)state.answers[state.idx]=-1;
      state.perQTimes[state.idx]=SECONDS_PER_Q;
      state.revealed[state.idx]=true;
      nextQuestion();
      return;
    }
    updateTimerUI();
  },1000);
}
function stopTimer(){if(state.timerId){clearInterval(state.timerId);state.timerId=null;}}
function updateTimerUI(){
  var el=document.getElementById("timer");
  var bar=document.getElementById("tbar-i");
  if(el){el.textContent=state.timeLeft+"s";el.className="timer"+(state.timeLeft<=10?" warn":"");}
  if(bar){bar.style.width=(state.timeLeft/SECONDS_PER_Q)*100+"%";bar.className=(state.timeLeft<=10?"warn":"");}
}
function nextQuestion(){
  stopTimer();
  state.idx++;
  if(state.idx>=state.questions.length){
    state.endTime=performance.now();
    computeResult();
    state.screen="result";render();
  } else render();
}
function computeResult(){
  var correct=0;
  state.questions.forEach(function(q,i){if(state.answers[i]===q.a)correct++;});
  state.score=correct;
  var ratio=correct/state.questions.length;
  var raw=105+(ratio-0.6)*60;
  var iq=Math.round(raw+(Math.random()*4-2));
  var L=tLevels();
  var level;
  if(iq>=131)level=L.high;
  else if(iq>=116)level=L.smart;
  else if(iq>=101)level=L.above;
  else if(iq>=85)level=L.avg;
  else if(iq>=75)level=L.below;
  else level=L.low;
  var pct=Math.max(1,Math.min(99,Math.round(50+(iq-100)*2.2)));
  state.result={iq:iq,level:level,correct:correct,pct:pct,seconds:Math.max(1,Math.round((state.endTime-state.startTime)/1000))};
}

function render(){
  var app=document.getElementById("app");
  if(state.screen==="start") app.innerHTML=viewStart();
  else if(state.screen==="quiz") app.innerHTML=viewQuiz();
  else if(state.screen==="result") app.innerHTML=viewResult();
  bind();
  if(state.screen==="quiz"&&!state.revealed[state.idx]) startTimer();
  var adBot=document.getElementById("adSlotBottom");
  if(adBot) adBot.style.display=(state.screen==="result")?"flex":"none";
  setTimeout(function(){
    try{
      var slots=document.querySelectorAll(".adsbygoogle");
      for(var i=0;i<slots.length;i++){
        if(slots[i].getAttribute("data-adsbygoogle-status"))continue;
        (window.adsbygoogle=window.adsbygoogle||[]).push({});
      }
    }catch(e){}
  },150);
}

function bind(){
  var app=document.getElementById("app");
  var i=state.idx;
  if(state.screen==="quiz"&&state.questions[i]&&!state.revealed[i]){
    var opts=app.querySelectorAll(".opt");
    for(var k=0;k<opts.length;k++){
      (function(el){
        el.addEventListener("click",function(ev){
          if(el.classList.contains("locked"))return;
          ev.preventDefault();
          var j=parseInt(el.getAttribute("data-idx"),10);
          state.answers[state.idx]=j;
          state.revealed[state.idx]=true;
          stopTimer();
          state.perQTimes[state.idx]=SECONDS_PER_Q-state.timeLeft;
          render();
        });
      })(opts[k]);
    }
  }
  var btns=app.querySelectorAll("[data-act]");
  for(var b=0;b<btns.length;b++){
    btns[b].addEventListener("click",function(){
      var a=this.getAttribute("data-act");
      if(a==="start"){
        state.questions=pickQuestions();
        state.answers=new Array(state.questions.length).fill(null);
        state.revealed=new Array(state.questions.length).fill(false);
        state.perQTimes=new Array(state.questions.length).fill(0);
        state.screen="quiz";state.idx=0;state.startTime=performance.now();render();
      }
      else if(a==="next"){nextQuestion();}
      else if(a==="back"){if(state.idx>0){state.idx--;render();}}
      else if(a==="finish"){state.endTime=performance.now();computeResult();state.screen="result";render();}
      else if(a==="retake"){stopTimer();state.screen="start";state.idx=0;state.questions=[];state.answers=[];state.revealed=[];state.result=null;render();}
      else if(a==="pdf"){askNameAndGenerate();}
    });
  }
}

var MiniPDF=(function(){
  function esc(s){return String(s).replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\x20-\x7E]/g,"");}
  function stream(c){return "<<\n/Length "+c.length+"\n>>\nstream\n"+c+"\nendstream";}
  function create(opts){
    var W=opts.width||842,H=opts.height||595,ops=opts.ops||[],content="";
    for(var i=0;i<ops.length;i++){
      var op=ops[i];
      if(op.type==="rect"){
        if(op.fill){content+=op.fill.r.toFixed(3)+" "+op.fill.g.toFixed(3)+" "+op.fill.b.toFixed(3)+" rg\n";content+=op.x+" "+(H-op.y-op.h)+" "+op.w+" "+op.h+" re f\n";}
        if(op.stroke){content+=op.stroke.r.toFixed(3)+" "+op.stroke.g.toFixed(3)+" "+op.stroke.b.toFixed(3)+" RG\n";content+=(op.strokeWidth||1)+" w\n";content+=op.x+" "+(H-op.y-op.h)+" "+op.w+" "+op.h+" re S\n";}
      } else if(op.type==="line"){
        content+=op.color.r.toFixed(3)+" "+op.color.g.toFixed(3)+" "+op.color.b.toFixed(3)+" RG\n";
        content+=(op.thickness||1)+" w\n";
        content+=op.x1+" "+(H-op.y1)+" m "+op.x2+" "+(H-op.y2)+" l S\n";
      } else if(op.type==="text"){
        content+="BT\n";
        content+=op.color.r.toFixed(3)+" "+op.color.g.toFixed(3)+" "+op.color.b.toFixed(3)+" rg\n";
        content+="/"+(op.font==="bold"?"F2":"F1")+" "+op.size+" Tf\n";
        content+="1 0 0 1 "+op.x+" "+(H-op.y-op.size)+" Tm\n";
        content+="("+esc(op.text)+") Tj\n";
        content+="ET\n";
      }
    }
    var header="%PDF-1.4\n";
    var objs=[
      "<< /Type /Catalog /Pages 2 0 R >>",
      "<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
      "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+W+" "+H+"] /Contents 4 0 R /Resources << /Font << /F1 5 0 R /F2 6 0 R >> >> >>",
      stream(content),
      "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>",
      "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>"
    ];
    var body=header,offsets=[0];
    for(i=0;i<objs.length;i++){offsets.push(body.length);body+=(i+1)+" 0 obj\n"+objs[i]+"\nendobj\n";}
    var xrefPos=body.length;
    body+="xref\n0 "+(objs.length+1)+"\n0000000000 65535 f \n";
    for(i=1;i<=objs.length;i++)body+=String(offsets[i]).padStart(10,"0")+" 00000 n \n";
    body+="trailer\n<< /Size "+(objs.length+1)+" /Root 1 0 R >>\nstartxref\n"+xrefPos+"\n%%EOF\n";
    return body;
  }
  return {create:create};
})();

function pdfText(text,size,bold){
  var w=0;
  for(var i=0;i<text.length;i++){
    var c=text.charCodeAt(i);
    if(c>=0x20&&c<=0x7E){
      if(c===32)w+=0.28;
      else if((c>=48&&c<=57)||(c>=65&&c<=90))w+=0.6;
      else if(c>=97&&c<=122)w+=0.55;
      else w+=0.5;
    }
  }
  return w*size*(bold?1.03:1);
}
function centerTextX(text,size,W,bold){return (W-pdfText(text,size,bold))/2;}

  var sl=t("certScore");
  ops.push({type:"text",text:sl,x:centerTextX(sl,13,W,false),y:boxY+16,size:13,font:"regular",color:DARK});
  var ss=String(r.iq);
  var scw=pdfText(ss,56,true);
  ops.push({type:"text",text:ss,x:(W-scw)/2,y:boxY+34,size:56,font:"bold",color:GREEN});
  var cs=t("certLevel")+": "+r.level;
  ops.push({type:"text",text:cs,x:centerTextX(cs,16,W,true),y:boxY+boxH+18,size:16,font:"bold",color:GOLD});
  var date=new Date().toLocaleDateString(getLang(),{year:"numeric",month:"long",day:"numeric"});
  var id="IQ-"+Date.now().toString(36).toUpperCase();
  var left=t("certDate")+": "+date;
  var right=t("certId")+": "+id;
  ops.push({type:"text",text:left,x:60,y:H-70,size:11,font:"regular",color:DARK});
  ops.push({type:"text",text:right,x:W-60-pdfText(right,11,false),y:H-70,size:11,font:"regular",color:DARK});
  var issued=t("certIssued");
  ops.push({type:"text",text:issued,x:centerTextX(issued,10,W,false),y:H-48,size:10,font:"regular",color:GREY});
  var pdf=MiniPDF.create({width:W,height:H,ops:ops});
  var blob=new Blob([pdf],{type:"application/pdf"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;a.download="Certificado-QI-"+r.iq+".pdf";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},4000);
}

/* ============== LANG SWITCHER ============== */
function renderLang(){
  var slot=document.getElementById("lang-slot");
  var code=getLang();
  var cur=LANGS[0];
  for(var i=0;i<LANGS.length;i++)if(LANGS[i].code===code)cur=LANGS[i];
  var html='<div class="lang-switch" data-open="false" id="ls">';
  html+='<span class="flag">'+FLAGS[cur.flag]+'</span>';
  html+='<span>'+cur.code.toUpperCase()+'</span>';
  html+='<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
  html+='<div class="lang-menu" style="display:none">';
  for(i=0;i<LANGS.length;i++){
    var l=LANGS[i];
    html+='<button data-code="'+l.code+'" data-active="'+(l.code===cur.code)+'">';
    html+='<span class="flag">'+FLAGS[l.flag]+'</span>';
    html+='<span>'+l.label+'</span></button>';
  }
  html+='</div></div>';
  slot.innerHTML=html;
  var ls=document.getElementById("ls");
  var menu=ls.querySelector(".lang-menu");
  ls.addEventListener("click",function(e){
    if(e.target.closest(".lang-menu"))return;
    var open=ls.getAttribute("data-open")==="true";
    ls.setAttribute("data-open",String(!open));menu.style.display=open?"none":"block";
  });
  var mbtns=menu.querySelectorAll("button");
  for(i=0;i<mbtns.length;i++){
    mbtns[i].addEventListener("click",function(){setLang(this.getAttribute("data-code"));});
  }
  document.addEventListener("mousedown",function(e){
    if(!ls.contains(e.target)){ls.setAttribute("data-open","false");menu.style.display="none";}
  });
}

/* ============== FOOTER i18n + COPY PIX ============== */
function applyFooterI18N(){
  var dt=document.getElementById("donationText");
  if(dt) dt.textContent=t("donationText");
  var cp=document.getElementById("btnCopyPixFooter");
  if(cp) cp.textContent=t("copyPix");
  var cp2=document.getElementById("creditPrefix");
  if(cp2) cp2.textContent=t("creditPrefix");
  var vc=document.getElementById("visitsChip");
  if(vc) vc.setAttribute("title", t("visitsChipTitle"));
}

function copyPixFooter(){
  var btn=document.getElementById("btnCopyPixFooter");
  var doCopy=function(){
    var orig=btn.textContent;
    btn.textContent=t("copied");
    setTimeout(function(){ btn.textContent=orig; },1600);
  };
  var fallback=function(){
    var ta=document.createElement("textarea");
    ta.value=PIX_KEY_FOOTER;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");}catch(e){}
    document.body.removeChild(ta);doCopy();
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(PIX_KEY_FOOTER).then(doCopy).catch(fallback);
  } else fallback();
}

/* ============== BOOT ============== */
try{
  setTheme(getTheme());
  document.documentElement.lang=getLang();
  document.documentElement.dir=getLang()==="ar"?"rtl":"ltr";
  renderVisits();
  renderLang();
  applyFooterI18N();
  render();

  document.getElementById("themeBtn").addEventListener("click", toggleTheme);
  var cpBtn=document.getElementById("btnCopyPixFooter");
  if(cpBtn) cpBtn.addEventListener("click", copyPixFooter);
}catch(err){
  console.error("Boot error:",err);
  document.getElementById("app").innerHTML=
    '<div class="card boot-error">'+
    '<h1>Não foi possível carregar</h1>'+
    '<p>Abra este arquivo diretamente no Chrome, Safari ou Firefox.</p>'+
    '<p style="font-size:13px;opacity:.7">'+String(err.message||err)+'</p>'+
    '</div>';
}
</script>
